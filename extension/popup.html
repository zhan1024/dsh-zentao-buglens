<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>禅图 BugLens</title><link rel="stylesheet" href="popup.css"></head><body><header><b>禅图 <small>BUGLENS</small></b><span>截图到禅道</span></header><p>在业务页面截图，圈出问题，再选择处理人。</p><label>完整工作台地址<input id="connection" type="password" placeholder="http://127.0.0.1:43921/#token=…" autocomplete="off"></label><button id="pair" class="secondary">保存本机配对</button><label>简单描述<textarea id="description" rows="3" placeholder="例如：保存提示成功，但刷新后数据消失"></textarea></label><button id="capture" class="primary">截图并打开提单工作台 ↗</button><hr><div class="record-row"><button id="record">开始取证</button><button id="stop">停止取证</button></div><label class="check"><input id="include-bodies" type="checkbox"> 同时采集接口入参与 JSON 响应</label><small>取证仅在开始后生效。接口内容可能含业务数据；凭据字段自动脱敏，提交前请检查截图和材料。</small><p id="status" role="status"></p><script type="module" src="popup.js"></script></body></html>
